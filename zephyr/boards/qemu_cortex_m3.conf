# boards/qemu_cortex_m3.conf — board-specific Kconfig for QEMU Cortex-M3
# Enables the LAN9118 Ethernet driver used by the mps2-an385 QEMU machine.
# The SLIRP backend makes the host appear at 10.0.2.2 inside QEMU.
#
# Build: west build -b qemu_cortex_m3
# Run:   west build -t run
#   or manually:
#   qemu-system-arm -M mps2-an385 -cpu cortex-m3 -nographic \
#     -kernel build/zephyr/zephyr.elf \
#     -netdev user,id=eth0,hostfwd=udp::5555-:5555,hostfwd=udp::5556-:5556 \
#     -net nic,model=lan9118,netdev=eth0

CONFIG_ETH_SMSC911X=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
