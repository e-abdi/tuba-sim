# config/sil.cfg — Gazebo <-> firmware bridge settings (bridge/sil_bridge.cpp)
#
# "key value" per line, '#' comments. Any key can be overridden on the
# command line with --set key=value, or changed live with "set key value"
# on the bridge's console.

# ---- Gazebo --------------------------------------------------------------
world              tuba_ocean
model              my_glider_v2
surface_z          20.0          # world z of the water surface
hull_centre_x      -0.5387       # model-frame x of the hull centre (depth report)
tail_end_x         -1.1887       # model-frame x of the aft end: antenna/GPS reference
buoyancy_topic     /model/my_glider_v2/buoyancy_engine
battery_topic      /my_glider_v2/battery_joint_pos
piston_topic       /my_glider_v2/vbd_joint_pos   # visual only; "" to disable
piston_max_m       0.05

# ---- Buoyancy pump -> bladder volume -------------------------------------
# Firmware pump position 0 = bladder fully IN (least buoyant) at boot;
# + seconds = pumping OUT. The real pump's stroke time is a firmware
# parameter ("Pump full stroke [s]") — keep it equal to pump_full_stroke_s.
pump_full_stroke_s 12.0
pump_min_l         0.0           # bladder volume at 0 s          (-5 N: dives)
pump_max_l         1.2           # bladder volume at full stroke  (+7 N)
#   0.5 L (5 s) is neutral; 0.6 L (6 s) floats ~70 deg nose-down, antenna out.

# ---- Pitch motor -> battery (mass shifter) position ----------------------
# Firmware pitch position 0 = battery fully AFT (nose-up) at boot;
# + seconds = FWD (nose-down). Full stroke = "Pitch full stroke [s]".
pitch_full_stroke_s 12.0
pitch_min_m        -0.05         # joint limit, fully aft  (~35 deg nose-up submerged)
pitch_max_m        0.14          # joint limit, fully fwd  (~75 deg nose-down)
limit_margin_s     0.15          # limit switch "pressed" within this of an end stop

# ---- Roll motor (no roll mass in the Gazebo model yet: tracked only) -----
roll_limit_s       10.0

# ---- Sensors ---------------------------------------------------------------
water_density      1025.0        # must match the firmware (SEA_WATER_DENSITY_KG_M3)
atm_pressure_pa    101325.0
water_temp_c       15.0
internal_pressure_pa 101300.0    # BMP180 (hull); "leak on" raises it slowly
internal_temp_c    25.0
ms5837_x           -0.5387       # pressure port location, model frame
ms5837_y           0.0
ms5837_z           -0.03
heading_offset_deg 0.0
gps_margin_m       0.0           # antenna (tail end) must be this far above the surface
gps_lat0           36.800        # world origin -> Monterey Bay
gps_lon0           -121.900
leak_dry_mv        3000
leak_wet_mv        400

# ---- Link ------------------------------------------------------------------
fw_host            127.0.0.1     # firmware address (an ESP32 on the Tuba-Glider AP: 192.168.4.1)
fw_port            5600
listen_port        5601
rate_hz            20
